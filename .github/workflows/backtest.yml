name: Backtest

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Data inizio (AAAA-MM-GG)"
        default: "2024-11-01"
      end:
        description: "Data fine (vuoto = ieri)"
        default: ""

concurrency:
  group: backtest
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cache dei dati storici (evita di riscaricarli)
        uses: actions/cache@v4
        with:
          path: cache
          key: dati-${{ inputs.start }}-${{ inputs.end }}-${{ hashFiles('config.yaml') }}
          restore-keys: dati-${{ inputs.start }}-${{ inputs.end }}-
      - name: Esegui il backtest
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          ARGS="--start ${{ inputs.start }}"
          if [ -n "${{ inputs.end }}" ]; then ARGS="$ARGS --end ${{ inputs.end }}"; fi
          python -m tbot.backtest $ARGS
          cat backtest/risultati.md >> "$GITHUB_STEP_SUMMARY"
      - name: Salva i risultati
        run: |
          git config user.name "trading-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A backtest
          if ! git diff --cached --quiet; then
            git commit -m "backtest $(date -u +'%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi
