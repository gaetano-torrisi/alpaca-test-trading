name: Report giornaliero

on:
  schedule:
    - cron: "30 21 * * 1-5"   # 22:30 ora italiana (inverno), dopo la chiusura di Wall Street
  workflow_dispatch: {}

concurrency:
  group: bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Genera il report
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m tbot.report >> "$GITHUB_STEP_SUMMARY"
      - name: Salva il report
        run: |
          git config user.name "trading-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A report
          if ! git diff --cached --quiet; then
            git commit -m "report $(date -u +'%Y-%m-%d')"
            git pull --rebase
            git push
          fi
