name: Bot trading (ogni 15 minuti a borsa aperta)

on:
  # Avvio automatico affidato al workflow "Motore bot (giro continuo)".
  # Questo resta per un giro manuale: Actions -> Run workflow.
  workflow_dispatch: {}

concurrency:
  group: bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  giro:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Esegui il bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m tbot.live
      - name: Salva registri e stato nel repository
        if: always()
        run: |
          git config user.name "trading-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for d in log state report; do if [ -e "$d" ]; then git add -A "$d"; fi; done
          if ! git diff --cached --quiet; then
            git commit -m "bot: giro $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi
