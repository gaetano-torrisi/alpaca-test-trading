name: Motore bot (giro continuo)

# Un turno dura ~5h40m: esegue i bot ogni 15 minuti a borsa aperta e il report serale,
# SOSPESO il 26/11/2026 su richiesta di Gaetano: niente avvio orario né riavvio automatico (solo avvio manuale).
on:
  workflow_dispatch: {}

concurrency:
  group: motore
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  turno:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Giro continuo dei bot
        env:
          MAIN_KEY: ${{ secrets.ALPACA_API_KEY }}
          MAIN_SECRET: ${{ secrets.ALPACA_SECRET_KEY }}
          TECH_KEY: ${{ secrets.ALPACA_TECH_API_KEY }}
          TECH_SECRET: ${{ secrets.ALPACA_TECH_SECRET_KEY }}
        run: bash scripts/motore.sh
