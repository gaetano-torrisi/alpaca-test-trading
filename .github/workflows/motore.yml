name: Motore bot (giro continuo)

# Un turno dura ~5h40m: esegue i bot ogni 15 minuti a borsa aperta e il report serale,
# poi si riavvia da solo. La programmazione oraria è solo una riserva, nel caso la catena si interrompa.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "23 * * * *"

concurrency:
  group: motore
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  turno:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Giro continuo dei bot
        env:
          MAIN_KEY: ${{ secrets.ALPACA_API_KEY }}
          MAIN_SECRET: ${{ secrets.ALPACA_SECRET_KEY }}
          TECH_KEY: ${{ secrets.ALPACA_TECH_API_KEY }}
          TECH_SECRET: ${{ secrets.ALPACA_TECH_SECRET_KEY }}
        run: bash scripts/motore.sh
      - name: Riavvia il motore per il turno successivo
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run motore.yml --ref main
