# =====================================================================
#  CONFIGURAZIONE DEL BOT  -  Alpaca Paper "Test Trading"  (capitale 1.000 $)
#  Strategia: MOMENTUM GIORNALIERO con semaforo di mercato e stop che sale.
#  Le modifiche settimanali si fanno qui, non nel codice.
# =====================================================================

trading_enabled: true          # false = il bot gira ma non invia ordini (solo log)

# --- Cosa può comprare -----------------------------------------------
# "attivi" = elenchi da cui il bot sceglie (vedi "universo_attivo" sotto)
universe:
  etf: [SPY, QQQ, IWM, DIA, XLK, XLF, XLE, XLV, XLY, XLP, XLI, XLB, XLU,
        XLRE, XLC, SMH, IBB, XBI, KRE, ITB, GDX, EFA, EEM]
  defensive: [TLT, IEF, GLD]   # comprabili anche con semaforo ROSSO
  leveraged: [TQQQ, SOXL, UPRO, TNA]   # ETF 3x: solo con semaforo VERDE
  # Maggiori aziende tecnologiche/internet USA a inizio 2016 (capitalizzazione > ~15 mld $), ancora quotate.
  # Elenco "di allora" per un backtest onesto: niente scelte fatte col senno di poi.
  tech2016: [AAPL, GOOGL, MSFT, META, AMZN, ORCL, INTC, CSCO, IBM, QCOM, TXN, AVGO, CRM, ADBE,
             PYPL, NFLX, EBAY, BKNG, CTSH, ACN, INTU, HPQ, HPE, AMAT, EA, MU, NVDA, ADI]
  nasdaq: [QQQ]                # Nasdaq 100
  nasdaq_leva: [TQQQ]          # Nasdaq 100 x3
  stocks: [NVDA, AAPL, MSFT, AMZN, META, GOOGL, TSLA, AMD, AVGO, NFLX,
           PLTR, COIN, MU, ORCL, CRM, ADBE, UBER, SHOP, MSTR, SMCI,
           ARM, ANET, PANW, CRWD, INTC, QCOM, JPM, GS, XOM, LLY,
           UNH, COST, WMT, BA, CAT, DIS, NKE, HOOD, SOFI, RIVN]
universo_attivo: [nasdaq_leva, defensive]   # strategia scelta: TQQQ con semaforo + difensivi

# --- Semaforo di mercato ---------------------------------------------
regime:
  enabled: true
  benchmark: QQQ
  sma_days: 200              # VERDE se il Nasdaq 100 (QQQ) chiude sopra la media degli ultimi 200 giorni

# --- Classifica (ogni settimana) -------------------------------------
ranking:
  lookbacks: [63, 126]       # forza = media dei rendimenti a 3 e 6 mesi...
  skip_days: 5               # ...escludendo l'ultima settimana
  trend_sma: 50              # il titolo deve stare sopra la sua media a 50 giorni
  require_trend: true
  require_positive: true     # e avere forza positiva
  min_price: 5
  top_n: 1                   # quanti titoli tenere
  hold_buffer: 8             # un titolo già in portafoglio resta finché è nei primi 8
  rebalance: daily           # weekly = primo giorno di borsa della settimana, daily = ogni giorno
  no_filter_classes: [etf, leveraged]   # classi esentate dai filtri di tendenza/forza (es. [etf, leveraged])
  defensive_only_when_red: true    # true = i difensivi solo con semaforo ROSSO

# --- Stop che sale ----------------------------------------------------
stop:
  atr_days: 20
  atr_mult: 1000             # stop disattivato: la protezione è il semaforo (stop stretti su TQQQ fanno solo danni)

# --- Notizie (uscita d'emergenza, solo nel bot reale) -----------------
news:
  enabled: true
  lookback_hours: 24
  block_buy_below: -0.5      # non compra se le notizie sono molto negative (almeno 2 articoli)
  emergency_sell_below: -0.6 # vende subito se esce una raffica di notizie molto negative (almeno 3)

# --- Rischio ----------------------------------------------------------
risk:
  max_drawdown_halt: 0.70    # solo freno d'emergenza: oltre il peggio visto nel backtest (-62%)
  halt_reset: false          # metti true (e poi di nuovo false) per riattivare dopo un blocco
  cash_buffer: 0.02          # lascia il 2% in liquidità per arrotondamenti

costs:
  slippage_bps: 5            # costo stimato per ogni compravendita (backtest)

# --- Backtest ---------------------------------------------------------
backtest:
  start: "2016-01-01"
  end: null                  # null = fino a ieri
  initial_equity: 1000
  split_date: "2022-01-01"   # periodo A = 2016-2021 (scelta), periodo B = 2022-oggi (verifica)
  variants:
    # --- riferimenti
    - nome: qqq_compra_e_tieni
      modifiche: {universo_attivo: [benchmark_only], regime.benchmark: QQQ, ranking.top_n: 1, regime.enabled: false,
                  ranking.require_trend: false, ranking.require_positive: false, stop.atr_mult: 1000}
    - nome: tqqq_semaforo_difensivi  # strategia attiva sul Paper
      modifiche: {universo_attivo: [nasdaq_leva, defensive], regime.benchmark: QQQ, ranking.top_n: 1, ranking.rebalance: daily,
                  ranking.no_filter_classes: [etf, leveraged], ranking.defensive_only_when_red: true, stop.atr_mult: 1000}
    - nome: tech2016_tutte_compra_e_tieni   # paniere: tutte le 28 a peso uguale, nessuna scelta
      modifiche: {universo_attivo: [tech2016], ranking.top_n: 28, ranking.hold_buffer: 28, regime.enabled: false,
                  ranking.require_trend: false, ranking.require_positive: false, stop.atr_mult: 1000}
    # --- singole aziende scelte dal bot (classifica settimanale + semaforo Nasdaq)
    - nome: tech2016_top5
      modifiche: {universo_attivo: [tech2016, defensive], ranking.top_n: 5, ranking.hold_buffer: 10, stop.atr_mult: 1000, regime.benchmark: QQQ, ranking.defensive_only_when_red: true}
    - nome: tech2016_top5_stop
      modifiche: {universo_attivo: [tech2016, defensive], ranking.top_n: 5, ranking.hold_buffer: 10, stop.atr_mult: 3.0, regime.benchmark: QQQ, ranking.defensive_only_when_red: true}
    - nome: tech2016_top3
      modifiche: {universo_attivo: [tech2016, defensive], ranking.top_n: 3, ranking.hold_buffer: 6, stop.atr_mult: 1000, regime.benchmark: QQQ, ranking.defensive_only_when_red: true}
    - nome: tech2016_top8
      modifiche: {universo_attivo: [tech2016, defensive], ranking.top_n: 8, ranking.hold_buffer: 16, stop.atr_mult: 1000, regime.benchmark: QQQ, ranking.defensive_only_when_red: true}
    - nome: tech2016_top5_senza_MU
      modifiche: {universo_attivo: [tech2016, defensive], universe.tech2016: [AAPL, GOOGL, MSFT, META, AMZN, ORCL, INTC, CSCO, IBM, QCOM, TXN, AVGO, CRM, ADBE, PYPL, NFLX, EBAY, BKNG, CTSH, ACN, INTU, HPQ, HPE, AMAT, EA, NVDA, ADI], ranking.top_n: 5, ranking.hold_buffer: 10, stop.atr_mult: 1000, regime.benchmark: QQQ, ranking.defensive_only_when_red: true}
    - nome: tech2016_top5_senza_MU_NVDA
      modifiche: {universo_attivo: [tech2016, defensive], universe.tech2016: [AAPL, GOOGL, MSFT, META, AMZN, ORCL, INTC, CSCO, IBM, QCOM, TXN, AVGO, CRM, ADBE, PYPL, NFLX, EBAY, BKNG, CTSH, ACN, INTU, HPQ, HPE, AMAT, EA, ADI], ranking.top_n: 5, ranking.hold_buffer: 10, stop.atr_mult: 1000, regime.benchmark: QQQ, ranking.defensive_only_when_red: true}
