# =====================================================================
#  CONFIGURAZIONE DEL BOT  -  Alpaca Paper "Test Trading"
#  Le modifiche settimanali si fanno qui, non nel codice.
# =====================================================================

# --- Interruttori generali -------------------------------------------
trading_enabled: true        # false = il bot gira ma non invia ordini (solo log)
crypto_enabled: true         # false = niente cripto (niente operatività nel weekend)
dynamic_guests: true         # aggiunge ogni giorno i titoli più attivi del momento

# --- Universo dei titoli ---------------------------------------------
universe:
  stocks:        # azioni molto liquide
    [NVDA, AAPL, MSFT, AMZN, META, GOOGL, TSLA, AMD, AVGO, NFLX,
     PLTR, COIN, MU, ORCL, CRM, ADBE, UBER, SHOP, MSTR, SMCI,
     ARM, ANET, PANW, CRWD, INTC, QCOM, JPM, GS, XOM, LLY,
     UNH, COST, WMT, BA, CAT, DIS, NKE, HOOD, SOFI, RIVN]
  index_etfs: [SPY, QQQ, IWM, XLK, XLF, XLE, SMH]
  leveraged_long: [TQQQ, SOXL, UPRO, TNA]     # ETF 3x al rialzo
  inverse: [SQQQ, SOXS, SPXU, TZA]            # ETF 3x al ribasso (solo con mercato in calo)
  crypto: [BTC/USD, ETH/USD, SOL/USD]

regime:
  stock_benchmark: SPY       # mercato "risk-on" se SPY chiude sopra la sua media a 50 giorni
  crypto_benchmark: BTC/USD
  ema_days: 50

# --- Regole di ingresso ----------------------------------------------
entry:
  breakout_bars: 20          # rottura del massimo delle ultime N barre da 15 min
  rsi_min: 50
  rsi_max: 78
  volume_ratio_min: 1.2      # volume della barra / media delle ultime 20 barre
  daily_ema_fast: 20         # tendenza giornaliera: close > EMA20 > EMA50
  daily_ema_slow: 50
  news_min_score: -0.25      # salta il titolo se le notizie delle ultime 24h sono negative
  max_new_per_run: 3

# --- Regole di uscita ------------------------------------------------
exit:
  atr_period: 14             # ATR sulle barre da 15 min
  stop_atr: 2.0              # stop-loss = ingresso - 2 ATR
  target_atr: 4.0            # take-profit = ingresso + 4 ATR
  breakeven_atr: 1.5         # dopo +1.5 ATR lo stop sale al prezzo di ingresso
  min_stop_pct: 0.006        # stop almeno allo 0,6% dal prezzo
  max_stop_pct: 0.06         # e non oltre il 6%
  max_hold_days: 5           # chiude comunque dopo 5 giorni
  exit_on_daily_trend_break: true   # chiude se il titolo chiude sotto la EMA20 giornaliera

# --- Gestione del rischio --------------------------------------------
risk:
  risk_per_trade: 0.015      # perdita massima per operazione = 1,5% del capitale
  leveraged_risk_factor: 0.5 # sugli ETF a leva si rischia la metà
  crypto_risk_factor: 0.7
  max_position_pct: 0.20     # nessuna posizione oltre il 20% del capitale
  max_gross_exposure: 1.5    # esposizione totale max 150% del capitale (margine)
  max_positions: 8
  max_crypto_positions: 2
  daily_loss_limit: 0.05     # -5% nel giorno: stop nuovi ingressi fino a domani
  max_drawdown_halt: 0.20    # -20% dal massimo: chiude tutto e si ferma
  halt_reset: false          # metti true (e poi di nuovo false) per riattivare dopo un halt

# --- Dati e costi ----------------------------------------------------
data:
  live_feed: iex             # gratuito, tempo reale
  backtest_feed: sip         # tutte le borse (storico gratuito)
  news_lookback_hours: 24

costs:                       # usati nel backtest per restare realistici
  stock_slippage_bps: 5
  crypto_slippage_bps: 15
  crypto_fee_bps: 25

backtest:
  start: "2024-11-01"
  end: null                  # null = fino a ieri
  initial_equity: 100000
  use_news: true
  split_date: "2026-01-01"   # periodo A = sviluppo, periodo B = verifica su dati "nuovi"
  variants:                  # confrontate nello stesso backtest (dati scaricati una volta)
    - nome: base
      modifiche: {}
    - nome: solo_azioni
      modifiche: {crypto_enabled: false, universe.leveraged_long: [], universe.inverse: []}
    - nome: solo_azioni_senza_notizie
      modifiche: {crypto_enabled: false, universe.leveraged_long: [], universe.inverse: [], entry.news_min_score: -1.0}
    - nome: solo_azioni_stop_larghi
      modifiche: {crypto_enabled: false, universe.leveraged_long: [], universe.inverse: [], exit.stop_atr: 3.0, exit.target_atr: 6.0}
    - nome: solo_azioni_lascia_correre
      modifiche: {crypto_enabled: false, universe.leveraged_long: [], universe.inverse: [], exit.target_atr: 8.0, exit.max_hold_days: 10}
